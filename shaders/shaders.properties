# LyMeowz Shader - OptiFine-format pack for Iris (OpenGL backend)

underwaterOverlay=false
vignette=false

# what is drawn into the shadow map
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
# clouds are drawn procedurally in the sky so water can reflect them
clouds=off

screen=<profile> <empty> [WATER] [WATER_QUALITY] [LIGHTING] [SKY] [POST]

screen.WATER=WATER_COLOR WATER_CLARITY <empty> <empty> WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_WAVE_SCALE <empty> WATER_REFRACTION WATER_REFLECTIONS WATER_PARALLAX WATER_CAUSTICS WATER_CAUSTICS_STRENGTH WATER_FOAM RAIN_RIPPLES
screen.WATER_QUALITY=WATER_WAVE_DETAIL WATER_SSR_STEPS
screen.LIGHTING=SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS COLORED_SHADOWS SHADOW_BIAS SHADOW_NORMAL_OFFSET <empty> SUN_INTENSITY TORCH_INTENSITY sunPathRotation
screen.SKY=PROCEDURAL_CLOUDS CLOUD_COVERAGE
screen.POST=EXPOSURE SATURATION VIGNETTE BLOOM BLOOM_STRENGTH

sliders=WATER_CLARITY WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_WAVE_DETAIL WATER_REFRACTION WATER_SSR_STEPS WATER_CAUSTICS_STRENGTH SHADOW_SOFTNESS SHADOW_BIAS SHADOW_NORMAL_OFFSET shadowMapResolution shadowDistance sunPathRotation SUN_INTENSITY TORCH_INTENSITY EXPOSURE SATURATION CLOUD_COVERAGE BLOOM_STRENGTH

profile.LOW=!BLOOM WATER_WAVE_DETAIL=3 WATER_SSR_STEPS=16 !WATER_PARALLAX !WATER_CAUSTICS !WATER_FOAM shadowMapResolution=1024 SHADOW_SOFTNESS=0.5
profile.MEDIUM=WATER_WAVE_DETAIL=4 WATER_SSR_STEPS=24 WATER_PARALLAX WATER_CAUSTICS WATER_FOAM shadowMapResolution=2048 SHADOW_SOFTNESS=1.0
profile.HIGH=WATER_WAVE_DETAIL=5 WATER_SSR_STEPS=32 WATER_PARALLAX WATER_CAUSTICS WATER_FOAM shadowMapResolution=2048 SHADOW_SOFTNESS=1.0
profile.ULTRA=WATER_WAVE_DETAIL=6 WATER_SSR_STEPS=64 WATER_PARALLAX WATER_CAUSTICS WATER_FOAM shadowMapResolution=4096 SHADOW_SOFTNESS=1.5
